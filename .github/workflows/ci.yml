name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Installs the pnpm version in `packageManager` and the Node version in `devEngines.runtime`, then runs `pnpm install --frozen-lockfile`
      - name: Set up pnpm and Node
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck

      # Ubuntu 24.04 runners block the unprivileged user namespaces Chromium's sandbox needs
      - name: Allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The server's tests run Playwright's Chromium
      - name: Install Chromium
        run: pnpm --filter @browsermcp/mcp exec playwright-core install --with-deps chromium

      - run: pnpm test
      - run: pnpm build

      # Drives the built extension through the server in headless Chromium
      - name: Smoke test
        run: pnpm smoke

      # The packaged runtime: installs Chromium into a temp directory and drives a page over MCP
      - name: Runtime end-to-end
        run: pnpm --filter ss-chromium e2e

  runtime:
    # The installer's target on each desktop platform: unit tests and the end-to-end run
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - run: pnpm build
      - run: pnpm --filter ss-chromium test
      - run: pnpm --filter ss-chromium e2e
